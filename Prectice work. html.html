<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>Vertical Card Scrolling Animation</title>
    <link rel="stylesheet" href="Prectice work. css.css">
   <body>
 
  <!-- SLIDER HTML -->

<div class="smooth-slider">

    <div class="slider-track">

        <div class="slide">
            <img src="book now .png" alt="">
        </div>

        <div class="slide">
            <img src="landing page banner.png" alt="">
        </div>

        <div class="slide">
            <img src="landing page banner.png" alt="">
        </div>

        <div class="slide">
            <img src="landing page banner.png" alt="">
        </div>

    </div>

</div>  

<script>
 // SMOOTH INFINITE SLIDER

const sliderTrack = document.querySelector(".slider-track");
const slides = document.querySelectorAll(".slide");

let currentIndex = 0;

function startSlider(){

    currentIndex++;

    sliderTrack.style.transition = "transform 1s ease-in-out";
    sliderTrack.style.transform = `translateX(-${currentIndex * 100}%)`;

    // LAST COPY SLIDE PAR
    if(currentIndex === slides.length - 1){

        setTimeout(() => {

            sliderTrack.style.transition = "none";
            currentIndex = 0;
            sliderTrack.style.transform = `translateX(0%)`;

        }, 1000);

    }

}

setInterval(startSlider, 3000);
</script>
 </body>
    
</html>
